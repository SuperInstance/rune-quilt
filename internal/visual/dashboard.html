<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>rune-quilt — Live Cell Graph</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin:0; padding:0; background:#0a0e14; color:#c9d1d9; }
  .header { padding: 20px 30px; background: linear-gradient(180deg, #161b22 0%, #0d1117 100%); border-bottom: 1px solid #30363d; }
  .header h1 { margin:0 0 8px; font-size:24px; color:#f0f6fc; }
  .header .meta { color:#8b949e; font-size:13px; }
  .stats { display:flex; gap:20px; margin-top:12px; flex-wrap:wrap; }
  .stat { background: rgba(177,186,196,0.1); border:1px solid #30363d; padding:6px 14px; border-radius:20px; font-size:13px; }
  .stat strong { color:#58a6ff; }
  .graph-container { width:100%; height:calc(100vh - 180px); position:relative; background: radial-gradient(ellipse at center, #0d1117 0%, #010409 100%); }
  svg { width:100%; height:100%; cursor:grab; }
  svg:active { cursor:grabbing; }
  .node circle { stroke:#30363d; stroke-width:1.5; }
  .node text { fill:#c9d1d9; font-size:10px; font-family:monospace; pointer-events:none; }
  .edge { stroke:#30363d; stroke-width:1; opacity:0.4; }
  .tooltip { position:absolute; background:#161b22; border:1px solid #58a6ff; padding:10px 14px; border-radius:6px; pointer-events:none; font-size:12px; max-width:320px; display:none; z-index:10; }
  .pulse { animation: pulse 0.6s ease-out; }
  @keyframes pulse { 0% { r:8; opacity:1; } 100% { r:20; opacity:0; } }
</style>
</head>
<body>
<div class="header">
  <h1>rune-quilt — Live Cell Graph</h1>
  <div class="meta" id="meta">connecting...</div>
  <div class="stats" id="stats"></div>
</div>
<div class="graph-container"><svg id="graph"></svg></div>
<div class="tooltip" id="tip"></div>
<script>
let nodes = new Map();
let edges = [];
let stats = {};
let svg, g, sim;

async function init() {
  svg = document.getElementById('graph');
  g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(g);

  // Initial snapshot
  const snap = await fetch('/snapshot').then(r => r.json());
  stats = snap.stats;
  for (const n of snap.cells) nodes.set(n.id, n);
  edges = snap.edges;
  updateStats();
  renderMeta(snap);

  // Force layout
  sim = makeLayout(nodes, edges, g);

  // SSE stream
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'cell-added' && ev.node) {
      nodes.set(ev.node.id, ev.node);
      addNode(ev.node);
    } else if (ev.type === 'edge' && ev.edge) {
      edges.push(ev.edge);
      addEdge(ev.edge);
    } else if (ev.type === 'stats' && ev.stats) {
      stats = ev.stats;
      updateStats();
    }
    sim.alpha(0.3).restart();
  };
}

function updateStats() {
  document.getElementById('stats').innerHTML =
    `<div class="stat"><strong>${nodes.size}</strong> cells</div>` +
    `<div class="stat"><strong>${edges.length}</strong> edges</div>` +
    `<div class="stat"><strong>${stats.witness_count || 0}</strong> witnesses</div>` +
    `<div class="stat"><strong>${stats.canon_hash || '?'}</strong> canon</div>`;
}

function renderMeta(snap) {
  document.getElementById('meta').innerHTML =
    `${snap.cluster} · SSE live · ${stats.a2a_cell_id || ''}`;
}

function addNode(n) {
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('r', 8);
  circle.setAttribute('fill', colorFor(n.role));
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('dy', -12);
  text.setAttribute('text-anchor', 'middle');
  text.textContent = n.name.length > 16 ? n.name.slice(-16) : n.name;
  const gnode = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  gnode.classList.add('node');
  gnode.dataset.id = n.id;
  gnode.appendChild(circle);
  gnode.appendChild(text);
  gnode.onmouseenter = (e) => showTip(e, n);
  gnode.onmouseleave = hideTip;
  g.appendChild(gnode);
}

function addEdge(e) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.classList.add('edge');
  line.dataset.src = e.source;
  line.dataset.dst = e.target;
  g.insertBefore(line, g.firstChild);
}

function colorFor(role) {
  return ({ advisor:'#58a6ff', ensemble:'#d2a8ff', polyformal:'#7ee787',
           shaper:'#f78166', test:'#8b949e', test_runner:'#a5a5ff',
           cell_router:'#ffa657', default:'#c9d1d9' })[role] || '#c9d1d9';
}

function showTip(e, n) {
  const tip = document.getElementById('tip');
  tip.innerHTML = `<h3>${n.name}</h3><div>${n.scope}</div><div>role: ${n.role}</div><div>lang: ${n.language || '?'}</div><div class="caps">${(n.caps||[]).map(c=>`<span class="cap">${c}</span>`).join(' ')}</div>`;
  tip.style.display = 'block';
  tip.style.left = (e.pageX + 12) + 'px';
  tip.style.top = (e.pageY + 12) + 'px';
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

// Vanilla force layout (no d3)
function makeLayout(nodes, edges, g) {
  const W = svg.clientWidth, H = svg.clientHeight;
  const pos = new Map();
  let i = 0;
  for (const n of nodes.values()) {
    pos.set(n.id, { x: W/2 + (Math.random()-0.5)*300, y: H/2 + (Math.random()-0.5)*300 });
  }
  let vel = new Map();
  for (const id of pos.keys()) vel.set(id, { x:0, y:0 });

  function tick() {
    // Repulsion
    const ids = [...pos.keys()];
    for (let a = 0; a < ids.length; a++) {
      for (let b = a+1; b < ids.length; b++) {
        const pa = pos.get(ids[a]), pb = pos.get(ids[b]);
        const dx = pb.x - pa.x, dy = pb.y - pa.y;
        const d2 = Math.max(20, dx*dx + dy*dy);
        const f = 800 / d2;
        const nx = dx / Math.sqrt(d2), ny = dy / Math.sqrt(d2);
        vel.get(ids[a]).x += nx*f; vel.get(ids[a]).y += ny*f;
        vel.get(ids[b]).x -= nx*f; vel.get(ids[b]).y -= ny*f;
      }
    }
    // Springs
    for (const e of edges) {
      const pa = pos.get(e.source), pb = pos.get(e.target);
      if (!pa || !pb) continue;
      const dx = pb.x - pa.x, dy = pb.y - pa.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      const f = (d - 80) * 0.05;
      vel.get(e.source).x += dx/d * f; vel.get(e.source).y += dy/d * f;
      vel.get(e.target).x -= dx/d * f; vel.get(e.target).y -= dy/d * f;
    }
    // Center pull + update
    for (const id of ids) {
      const p = pos.get(id), v = vel.get(id);
      v.x = (v.x + (W/2 - p.x) * 0.01) * 0.85;
      v.y = (v.y + (H/2 - p.y) * 0.01) * 0.85;
      p.x += v.x; p.y += v.y;
      const circle = g.querySelector(`g.node[data-id="${id}"]`);
      if (circle) {
        circle.setAttribute('transform', `translate(${p.x},${p.y})`);
      }
    }
    // Edges
    for (const e of edges) {
      const pa = pos.get(e.source), pb = pos.get(e.target);
      if (!pa || !pb) continue;
      const line = g.querySelector(`line[data-src="${e.source}"][data-dst="${e.target}"]`);
      if (line) { line.setAttribute('x1', pa.x); line.setAttribute('y1', pa.y); line.setAttribute('x2', pb.x); line.setAttribute('y2', pb.y); }
    }
  }
  let alpha = 1;
  function loop() {
    if (alpha > 0.001) {
      tick();
      alpha *= 0.99;
      requestAnimationFrame(loop);
    }
  }
  loop();
  return { restart() { alpha = 1; loop(); } };
}

// Initial render
for (const n of nodes.values()) addNode(n);
for (const e of edges) addEdge(e);

init();
</script>
</body>
</html>
